[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "compositional_rsl_rl"
version = "0.1.0"
description = "Simulator-independent network and loss composition for RSL-RL"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "BSD-3-Clause"}
dependencies = ["rsl-rl-lib==5.5.1"]

[project.urls]
Repository = "https://github.com/jnskkmhr/compositional_rsl_rl"

[project.optional-dependencies]
test = ["pytest", "onnx", "onnxruntime"]

[tool.setuptools]
license-files = ["LICENSE", "licenses/dependencies/IsaacLab.txt"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
